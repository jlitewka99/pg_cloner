name: Release beta

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Allow only semantic-version tags already on main
        id: gate
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: $tag is not a vMAJOR.MINOR.PATCH release tag."
            exit 0
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "release_allowed=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag points to a commit already contained in main."
          else
            echo "release_allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: release tag $tag must point to a commit already contained in main."
          fi

  release:
    needs: validate-release-source
    if: needs.validate-release-source.outputs.release_allowed == 'true'
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release_metadata
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages into the release workspace
        env:
          CLONED_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PGCloner.xcodeproj \
            -scheme PGClonerApp \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR"

      - name: Run Swift package tests
        run: swift test --disable-sandbox --enable-swift-testing --disable-xctest

      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_BUILD: ${{ steps.release_metadata.outputs.version }}
          CLONED_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
        run: scripts/release.sh

      - name: Validate release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          app='dist/PG Cloner.app'
          version="$RELEASE_VERSION"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "$version"
          lipo -archs "$app/Contents/MacOS/PGClonerApp" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/PGClonerApp" | grep -q x86_64
          codesign --verify --deep --strict "$app"
          unzip -t "dist/PG-Cloner-v${version}.zip"
          (
            cd dist
            shasum -a 256 -c "PG-Cloner-v${version}.zip.sha256"
            shasum -a 256 -c "PG-Cloner-v${version}.dmg.sha256"
          )

      - name: Create or reuse GitHub Release
        id: github_release
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Reusing existing GitHub Release $RELEASE_TAG."
            gh release download "$RELEASE_TAG" \
              --pattern "PG-Cloner-v${RELEASE_VERSION}.zip" \
              --dir dist \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/PG-Cloner-v${RELEASE_VERSION}.zip" \
              "dist/PG-Cloner-v${RELEASE_VERSION}.zip.sha256" \
              "dist/PG-Cloner-v${RELEASE_VERSION}.dmg" \
              "dist/PG-Cloner-v${RELEASE_VERSION}.dmg.sha256" \
              --title "PG Cloner $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Generate signed Sparkle appcast
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
          SPARKLE_GENERATE_APPCAST: ${{ runner.temp }}/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          scripts/generate_appcast.sh "$RUNNER_TEMP/pages/appcast.xml"

      - name: Build Pages landing page
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PG Cloner beta</title></head>' \
            '  <body>' \
            '    <h1>PG Cloner beta</h1>' \
            "    <p>Latest beta: <strong>${RELEASE_TAG}</strong></p>" \
            "    <p><a href=\"https://github.com/jlitewka99/pg_cloner/releases/download/${RELEASE_TAG}/PG-Cloner-v${RELEASE_VERSION}.dmg\">Download DMG</a></p>" \
            '    <p><a href="appcast.xml">Sparkle update feed</a></p>' \
            '    <p>This internal beta is not notarized; follow the first-run instructions in the DMG.</p>' \
            '  </body>' \
            '</html>' \
            > "$RUNNER_TEMP/pages/index.html"
          touch "$RUNNER_TEMP/pages/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
