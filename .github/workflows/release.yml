name: Release beta

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      release_reason: ${{ steps.metadata.outputs.release_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        run: |
          git fetch --force --tags origin
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          metadata="$(zsh scripts/release_metadata.sh --commit "$GITHUB_SHA")"
          printf '%s\n' "$metadata"
          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
          done <<< "$metadata"

  release:
    name: Build and publish release
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
      SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages into the release workspace
        env:
          CLONED_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PGCloner.xcodeproj \
            -scheme PGClonerApp \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR"

      - name: Set up Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.25.1'
          cache: false

      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Run release metadata tests
        run: zsh scripts/test_release_metadata.sh

      - name: Run Swift package tests
        run: swift test --disable-sandbox --enable-swift-testing --disable-xctest

      - name: Build release artifacts
        env:
          RELEASE_BUILD: ${{ needs.resolve-release.outputs.version }}
          CLONED_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
        run: scripts/release.sh

      - name: Validate release artifacts
        run: |
          app='dist/PG Cloner.app'
          version="$RELEASE_VERSION"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "$version"
          lipo -archs "$app/Contents/MacOS/PGClonerApp" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/PGClonerApp" | grep -q x86_64
          codesign --verify --deep --strict "$app"
          unzip -t "dist/PG-Cloner-v${version}.zip"
          (
            cd dist
            shasum -a 256 -c "PG-Cloner-v${version}.zip.sha256"
            shasum -a 256 -c "PG-Cloner-v${version}.dmg.sha256"
          )

      - name: Create or verify release tag
        run: |
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tag_commit" = "$GITHUB_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "PG Cloner $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create or update GitHub Release
        run: |
          assets=(
            "dist/PG-Cloner-v${RELEASE_VERSION}.zip"
            "dist/PG-Cloner-v${RELEASE_VERSION}.zip.sha256"
            "dist/PG-Cloner-v${RELEASE_VERSION}.dmg"
            "dist/PG-Cloner-v${RELEASE_VERSION}.dmg.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "PG Cloner $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_GENERATE_APPCAST: ${{ runner.temp }}/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          scripts/generate_appcast.sh "$RUNNER_TEMP/pages/appcast.xml"

      - name: Build Pages landing page
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PG Cloner beta</title></head>' \
            '  <body>' \
            '    <h1>PG Cloner beta</h1>' \
            "    <p>Latest beta: <strong>${RELEASE_TAG}</strong></p>" \
            "    <p><a href=\"https://github.com/jlitewka99/pg_cloner/releases/download/${RELEASE_TAG}/PG-Cloner-v${RELEASE_VERSION}.dmg\">Download DMG</a></p>" \
            '    <p><a href="appcast.xml">Sparkle update feed</a></p>' \
            '    <p>This internal beta is not notarized; follow the first-run instructions in the DMG.</p>' \
            '  </body>' \
            '</html>' \
            > "$RUNNER_TEMP/pages/index.html"
          touch "$RUNNER_TEMP/pages/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.0
