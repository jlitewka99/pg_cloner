name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Run Swift package tests
        run: swift test --disable-sandbox --enable-swift-testing --disable-xctest

      - name: Build macOS application
        run: |
          xcodebuild \
            -project PGCloner.xcodeproj \
            -scheme PGClonerApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
